<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220">
  <defs>
    <linearGradient id="beamfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4dd0e1" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4dd0e1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" fill="#0d1117"/>
  <!-- storage ring: thick arc, center (120,300) r=210, cropped by the bottom/left edges -->
  <circle cx="120" cy="300" r="210" fill="none" stroke="#21262d" stroke-width="26"/>
  <!-- photons leave tangent to the ring: main extraction at the arc crest -->
  <line x1="101.7" y1="90.8" x2="700" y2="38.4" stroke="url(#beamfade)" stroke-width="1.5"/>
  <circle cx="101.7" cy="90.8" r="3" fill="#4dd0e1"/>
  <!-- fainter tangent rays from other points on the ring -->
  <line x1="191.8" y1="102.7" x2="514" y2="220" stroke="#4dd0e1" stroke-width="1" opacity="0.18"/>
  <line x1="15" y1="118.1" x2="220" y2="0" stroke="#4dd0e1" stroke-width="1" opacity="0.18"/>
  <!-- name + role -->
  <text x="640" y="112" font-family='"Segoe UI", "Helvetica Neue", sans-serif'
        font-size="34" font-weight="600" fill="#e6edf3">Ronald Pandolfi</text>
  <text x="640" y="140" font-family='"SF Mono", "Segoe UI Mono", "Cascadia Code", monospace'
        font-size="13" fill="#8b949e">Scientific software · Beamline Controls</text>
  <text x="640" y="160" font-family='"SF Mono", "Segoe UI Mono", "Cascadia Code", monospace'
        font-size="13" fill="#8b949e">AMCR · CAMERA · LBNL</text>
</svg>
